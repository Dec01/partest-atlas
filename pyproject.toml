[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "partest-atlas"
version = "0.1.0"
description = "Сбор наблюдений о системе и о прогоне тестов в версионированные артефакты — агент карты «Веха»"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "dec01" }]
keywords = ["testing", "coverage", "observability", "pytest", "openapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "partest>=1.8",
    "PyYAML>=6.0.2",
]

[project.optional-dependencies]
# Драйверы вынесены в extras намеренно: их лицензии и их вес не должны навязываться
# проекту, которому нужен только сбор контракта или разбор спецификаций.
# psycopg распространяется под LGPL — держим отдельно и заменяемым.
postgres = ["psycopg[binary]>=3.2.0"]
kafka = ["kafka-python>=2.0.2"]
ui = ["playwright>=1.40.0"]
specs = []
all = ["partest-atlas[postgres,kafka,ui]"]

# Имя команды намеренно длинное: короткое `atlas` уже занято в экосистеме
# (MongoDB Atlas CLI), а конфликт имён в закрытом контуре ловится дорого.
[project.scripts]
partest-atlas = "partest_atlas.cli:main"

# Строка появляется вместе с модулем — не раньше и не позже. Соответствие в обе
# стороны держит `tests/test_packaging.py`.
[project.entry-points.pytest11]
partest_atlas_db_effects = "partest_atlas.plugins.db_effects"
partest_atlas_bus_flow = "partest_atlas.plugins.bus_flow"
partest_atlas_ui_flow = "partest_atlas.plugins.ui_flow"

# Все три точки входа объявлены — и каждая появилась вместе со своим модулем.
# История, из-за которой это правило записано:
#
# Они были объявлены до того, как появились модули плагинов, и цена оказалась
# несоразмерной: pytest грузит `pytest11` на старте, **до сбора тестов**, поэтому
# установка пакета роняла у потребителя любой прогон целиком —
# `ModuleNotFoundError: partest_atlas.plugins.bus_flow` вместо единственного
# проходящего теста. Замер 2026-09-25 в чистом окружении.
#
# Разница в цене принципиальная. Объявленная, но отсутствующая **команда** мешает
# тому, кто её позвал. Объявленный, но отсутствующий **плагин** мешает всем и
# всегда, включая прогоны, которые про карту ничего не знают.
#
# Маркера требований здесь нет и не будет — он живёт в partest, потому что
# полезен и без карты.

[tool.setuptools.packages.find]
include = ["partest_atlas*"]
